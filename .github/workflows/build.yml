name: Build kernel
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "defconfig name in arch/arm64/configs/vendor"
        default: "citrus-perf_defconfig"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk + add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h; df -h

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio python-is-python3 zip curl \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler

      - name: Fetch AOSP clang r450784b
        run: |
          set -eo pipefail
          mkdir -p "$HOME/clang" && cd "$HOME/clang"
          curl -fL --retry 3 -o clang.tgz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/ab73cd180863dbd17fdb8f20e39b33ab38030cf9/clang-r450784b.tar.gz"
          tar xzf clang.tgz
          rm clang.tgz
          ./bin/clang --version

      - name: Build
        run: |
          set -eo pipefail
          export PATH="$HOME/clang/bin:$PATH"
          export ARCH=arm64
          export KCFLAGS="-Wno-error -Wno-error=incompatible-function-pointer-types -Wno-incompatible-function-pointer-types"
          test -f prebuilt/dtbo.img || { echo "prebuilt/dtbo.img NOT FOUND"; exit 1; }
          ARGS="O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- DTC_FLAGS=-f"
          DEF=arch/arm64/configs/vendor/${{ github.event.inputs.defconfig }}
          sed -i '/CONFIG_LITTLE_CPU_MASK/d;/CONFIG_BIG_CPU_MASK/d' "$DEF"
          printf 'CONFIG_LITTLE_CPU_MASK=0\nCONFIG_BIG_CPU_MASK=0\n' >> "$DEF"
          sed -i '/-plugin-opt=-warn-stack-size/d' Makefile
          make $ARGS vendor/${{ github.event.inputs.defconfig }}
          scripts/config --file out/.config -d LTO_CLANG -e LTO_NONE -e STUNE_ASSIST \
            -d CRYPTO_DEV_QCOM_ICE \
            -e BLK_INLINE_ENCRYPTION -e BLK_INLINE_ENCRYPTION_FALLBACK -e FS_ENCRYPTION_INLINE_CRYPT \
            -e SCSI_UFS_CRYPTO -e SCSI_UFS_CRYPTO_QTI -e MMC_CQHCI_CRYPTO -e MMC_CQHCI_CRYPTO_QTI \
            -e QTI_CRYPTO_COMMON -e QTI_CRYPTO_TZ -e DM_DEFAULT_KEY \
            -e FS_VERITY -e FS_VERITY_BUILTIN_SIGNATURES
          make $ARGS olddefconfig
          for s in BLK_INLINE_ENCRYPTION BLK_INLINE_ENCRYPTION_FALLBACK FS_ENCRYPTION_INLINE_CRYPT SCSI_UFS_CRYPTO SCSI_UFS_CRYPTO_QTI MMC_CQHCI_CRYPTO MMC_CQHCI_CRYPTO_QTI QTI_CRYPTO_COMMON QTI_CRYPTO_TZ DM_DEFAULT_KEY FS_VERITY FS_VERITY_BUILTIN_SIGNATURES; do
            grep -q "^CONFIG_$s=y" out/.config && echo "OK      $s" || echo "MISSING $s"
          done
          grep -n "CRYPTO_DEV_QCOM_ICE" out/.config || true
          if [ -f prebuilt/moonbase.config ]; then
            norm() { grep -E '^(CONFIG_|# CONFIG_)' "$1" | sed -E 's/^# (CONFIG_[A-Za-z0-9_]+) is not set/\1=n/' | sort; }
            norm out/.config > /tmp/mine.norm
            norm prebuilt/moonbase.config > /tmp/moon.norm
            diff /tmp/moon.norm /tmp/mine.norm > config-diff.txt || true
            wc -l config-diff.txt
          fi
          make $ARGS -j4 -k < /dev/null > build.log 2>&1 || true
          grep -n -B2 -A4 "error:\|ERROR:" build.log | head -80 || true
          tail -n 5 build.log
          ls -l out/arch/arm64/boot/ || true
          test -f out/arch/arm64/boot/Image.gz
          grep -m1 "UTS_RELEASE" out/include/generated/utsrelease.h | tee -a build.log

      - name: Package AnyKernel3
        run: |
          set -eo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cd ak3
          echo "--- template vars (original):"
          grep -niE "^(block|is_slot_device|ramdisk_compression|patch_vbmeta_flag)=" anykernel.sh || true
          rm -rf .git .github README.md anykernel.sh
          cp ../out/arch/arm64/boot/Image.gz .
          cp ../prebuilt/dtbo.img .
          cat > anykernel.sh <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          ## AnyKernel setup
          # begin properties
          properties() { '
          kernel.string=Nugget-Kernel-236
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=citrus
          device.name2=lime
          device.name3=lemon
          device.name4=pomelo
          device.name5=juice
          supported.versions=11.0 - 12.0
          supported.patchlevels=
          '; } # end properties

          # shell variables (both cases: new and old AnyKernel3 core)
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;

          ## AnyKernel methods (DO NOT CHANGE)
          . tools/ak3-core.sh;

          ## AnyKernel file attributes
          set_perm_recursive 0 0 755 644 $ramdisk/*;
          set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin;

          ui_print "Nugget-Kernel-236 / Poco M3 (citrus)";

          dump_boot;
          write_boot;
          EOF
          grep -q "omap" anykernel.sh && { echo "omap path still in anykernel.sh"; exit 1; } || true
          grep -q "^BLOCK=/dev/block/bootdevice/by-name/boot;" anykernel.sh || { echo "BLOCK missing"; exit 1; }
          grep -nE "^(BLOCK|block|IS_SLOT_DEVICE|device.name|kernel.string)" anykernel.sh
          echo "--- core uses:"
          grep -nE 'BLOCK|\$block' tools/ak3-core.sh | head -8 || true
          zip -r9 ../Nugget-Kernel-citrus.zip . -x "*placeholder"
          unzip -l ../Nugget-Kernel-citrus.zip | grep -E "Image.gz|dtbo.img|anykernel.sh|ak3-core"
          ls -lh ../Nugget-Kernel-citrus.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-out
          path: |
            Nugget-Kernel-citrus.zip
            config-diff.txt
            out/arch/arm64/boot/Image*
            build.log
