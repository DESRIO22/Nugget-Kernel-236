      - name: Find wrappers
        run: |
          grep -n "boost_write_wrapper\|prefer_idle_write_wrapper" kernel/sched/tune.c || true
          echo "=== ifdefs ==="
          grep -n "^#if\|^#endif\|^#else" kernel/sched/tune.c | head -60
          echo "=== defconfig ==="
          grep -n "SCHED_TUNE\|STUNE\|SCHEDTUNE" arch/arm64/configs/vendor/${{ github.event.inputs.defconfig }} || true
          exit 1
