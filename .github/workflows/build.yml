name: Build kernel
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "defconfig name in arch/arm64/configs/vendor"
        default: "citrus-perf_defconfig"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Compare sources
        run: |
          echo "##### MY REPO #####"
          git log -1 --format='%h %cd %s'
          echo "--- inline crypto files:"
          git ls-tree -r HEAD --name-only | grep -iE "crypto-qti|blk-crypto|keyslot-manager|dm-default-key" || echo "NONE"
          echo "--- commits mentioning kamorta/qssi:"
          git log --oneline | grep -iE "kamorta|qssi|LA\.UM\.9\.15" | head -15 || true
          echo "--- 4.19.x version bumps:"
          git log --oneline | grep -E "Linux 4\.19\.[0-9]+$" | head -5 || true

          echo
          echo "##### JAVASHIN #####"
          git clone --filter=blob:none --no-checkout https://github.com/javashin/Xiaomi-Fury-Bengal-SD662 moon
          cd moon
          echo "--- branches:"
          git branch -r
          for b in $(git branch -r | grep -v HEAD | sed 's/ //g' | head -8); do
            echo "=== $b"
            git log -1 --format='%h %cd %s' $b
            git ls-tree -r $b --name-only | grep -iE "crypto-qti|blk-crypto|keyslot-manager|dm-default-key" | head -4 || echo "NONE"
            git log $b --oneline | grep -iE "kamorta|qssi" | head -3 || true
            git log $b --oneline | grep -E "Linux 4\.19\.[0-9]+$" | head -2 || true
          done
          exit 1
