name: Build kernel
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "defconfig name in arch/arm64/configs/vendor"
        default: "citrus-perf_defconfig"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check
        run: |
          echo "=== STUNE_ASSIST refs ==="
          grep -rn "STUNE_ASSIST" --include="Kconfig*" --include="*defconfig" --include="*.c" --include="*.h" . | head -20 || true
          echo "=== boost_write refs ==="
          grep -n "boost_write" kernel/sched/tune.c || true
