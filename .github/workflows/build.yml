name: Build kernel
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "defconfig name in arch/arm64/configs/vendor"
        default: "citrus-perf_defconfig"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk + add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h; df -h

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio python-is-python3 \
            clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Build
        run: |
          export ARCH=arm64
          ARGS="O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS=-Wno-error"
          DEF=arch/arm64/configs/vendor/${{ github.event.inputs.defconfig }}
          grep -rn -A6 "config LITTLE_CPU_MASK" --include="Kconfig*" . | head -30 || true
          sed -i '/CONFIG_LITTLE_CPU_MASK/d;/CONFIG_BIG_CPU_MASK/d' "$DEF"
          printf 'CONFIG_LITTLE_CPU_MASK="0-3"\nCONFIG_BIG_CPU_MASK="4-7"\n' >> "$DEF"
          make $ARGS vendor/${{ github.event.inputs.defconfig }}
          scripts/config --file out/.config -d LTO_CLANG -e LTO_NONE
          make $ARGS olddefconfig
          yes "" | timeout 3m make $ARGS -j4 2>&1 | tee build.log
          grep -m1 "UTS_RELEASE" out/include/generated/utsrelease.h | tee -a build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-out
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb
            build.log
