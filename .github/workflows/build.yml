name: Build kernel
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "defconfig name in arch/arm64/configs/vendor"
        default: "citrus-perf_defconfig"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Find flag
        run: |
          grep -rn "warn-stack-size" . --include="Makefile*" --include="*.mk" --include="Kbuild" --include="*.sh" --include="*.py" 2>/dev/null | head -20 || true
          echo "=== README toolchain ==="
          grep -rniE "clang|toolchain|proton|neutron|aosp" README* 2>/dev/null | head -20 || true
          echo "=== vdso makefile ==="
          sed -n 55,75p arch/arm64/kernel/vdso/Makefile
          exit 1
