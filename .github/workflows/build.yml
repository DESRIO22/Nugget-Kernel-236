name: Build kernel
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "defconfig name in arch/arm64/configs/vendor"
        default: "citrus-perf_defconfig"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk + add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h; df -h

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio python-is-python3 zip \
            clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Build
        run: |
          set -eo pipefail
          export ARCH=arm64
          ARGS="O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- DTC_FLAGS=-f KCFLAGS=\"-Wno-error -Wno-incompatible-function-pointer-types -Wno-implicit-function-declaration -Wno-int-conversion -Wno-implicit-int -Wno-strict-prototypes -Wno-unused-but-set-variable\""
          DEF=arch/arm64/configs/vendor/${{ github.event.inputs.defconfig }}
          sed -i '/CONFIG_LITTLE_CPU_MASK/d;/CONFIG_BIG_CPU_MASK/d' "$DEF"
          printf 'CONFIG_LITTLE_CPU_MASK=15\nCONFIG_BIG_CPU_MASK=240\n' >> "$DEF"
          sed -i '/-plugin-opt=-warn-stack-size/d' Makefile
          eval make $ARGS vendor/${{ github.event.inputs.defconfig }}
          scripts/config --file out/.config -d LTO_CLANG -e LTO_NONE -e STUNE_ASSIST
          eval make $ARGS olddefconfig
          eval make $ARGS -j4 -k < /dev/null > build.log 2>&1 || true
          grep -n -B2 -A4 "error:\|ERROR:" build.log | head -80 || true
          tail -n 5 build.log
          test -f out/arch/arm64/boot/Image
          test -f out/arch/arm64/boot/Image.gz
          grep -m1 "UTS_RELEASE" out/include/generated/utsrelease.h | tee -a build.log

      - name: Package AnyKernel3
        run: |
          set -eo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cd ak3
          rm -rf .git .github README.md
          cp ../out/arch/arm64/boot/Image.gz .
          sed -i 's|^kernel.string=.*|kernel.string=Nugget-Kernel-236|' anykernel.sh
          sed -i 's|^device.name1=.*|device.name1=citrus|' anykernel.sh
          sed -i 's|^device.name2=.*|device.name2=lime|' anykernel.sh
          sed -i 's|^device.name3=.*|device.name3=|' anykernel.sh
          sed -i 's|^device.name4=.*|device.name4=|' anykernel.sh
          sed -i 's|^device.name5=.*|device.name5=|' anykernel.sh
          sed -i 's|^block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          sed -i 's|^BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          grep -nE "^(kernel.string|device.name|block|BLOCK|do\.|is_slot_device|IS_SLOT_DEVICE)" anykernel.sh
          zip -r9 ../Nugget-Kernel-citrus.zip . -x "*placeholder"
          ls -lh ../Nugget-Kernel-citrus.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-out
          path: |
            Nugget-Kernel-citrus.zip
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb
