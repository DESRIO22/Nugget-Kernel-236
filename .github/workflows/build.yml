name: Build kernel
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "defconfig name in arch/arm64/configs/vendor"
        default: "citrus-perf_defconfig"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          set -eo pipefail
          grep -rn -B2 -A8 "config LITTLE_CPU_MASK" --include="Kconfig*" . | head -40
          echo "=== usages ==="
          grep -rn "LITTLE_CPU_MASK\|BIG_CPU_MASK" --include="*.c" --include="*.h" --include="Makefile" --include="*defconfig" . | head -30
          exit 1
