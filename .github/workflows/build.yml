name: Build kernel
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "defconfig name in arch/arm64/configs/vendor"
        default: "citrus-perf_defconfig"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio python-is-python3 \
            clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
      - name: Build
        run: |
          export ARCH=arm64
          ARGS="O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS=-Wno-error"
          make $ARGS vendor/${{ github.event.inputs.defconfig }}
          make $ARGS olddefconfig
          make $ARGS -j$(nproc) 2>&1 | tee build.log
          grep -m1 "UTS_RELEASE" out/include/generated/utsrelease.h | tee -a build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-out
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb
            build.log
