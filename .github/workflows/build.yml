name: Build kernel
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "defconfig name in arch/arm64/configs/vendor"
        default: "citrus-perf_defconfig"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Find wrappers
        run: |
          echo "=== usages ==="
          grep -n "boost_write_wrapper\|prefer_idle_write_wrapper" kernel/sched/tune.c || true
          echo "=== ifdefs ==="
          grep -n "^#if\|^#endif\|^#else" kernel/sched/tune.c | head -60
          echo "=== defconfig ==="
          grep -n "SCHED_TUNE\|STUNE\|SCHEDTUNE" arch/arm64/configs/vendor/${{ github.event.inputs.defconfig }} || true
          echo "=== tune.c 575-600 ==="
          sed -n 575,600p kernel/sched/tune.c
          echo "=== tune.c 745-765 ==="
          sed -n 745,765p kernel/sched/tune.c
          exit 1
